# Default configuration for Hive Automation Bot
# Override with ~/.hive_bot/config.yaml or environment variables

browser:
  # Browser channel: null = Playwright Chromium / Chrome for Testing, "chrome" = branded installed Chrome
  channel: null

  # Browser launch mode
  headless: false
  
  # Chrome user profile path (for persistent login)
  browser_profile_path: ~/.hive_bot_profile
  
  # Default timeout for browser operations (milliseconds)
  timeout_default_ms: 30000

auth:
  # Login timeout (seconds)
  login_timeout_s: 60
  
  # Credentials loaded from environment variables:
  # HIVE_LOGIN_URL, HIVE_USERNAME, HIVE_PASSWORD

hive:
  # Hive platform configuration
  # URL patterns are loaded from environment
  login_url_env: HIVE_LOGIN_URL
  contest_url_env: HIVE_CONTEST_URL

state:
  # State persistence configuration
  persistence_file: ~/.hive_bot/state.json
  
  # Auto-save on state changes
  auto_checkpoint: true

logging:
  # Logging configuration
  level: INFO
  
  # Log file path
  log_file: logs/hive_bot.log
  
  # Max log file size before rotation (MB)
  max_log_size_mb: 100
  
  # Number of backup log files to keep
  backup_count: 3

features:
  # Feature flags
  dry_run: false

solver:
  # Problem solving configuration
  default_language: C++
  max_attempts: 5
  max_platform_retries: 3
  run_timeout_seconds: 30.0
  submit_timeout_seconds: 60.0
  run_sample_tests: true

ai_providers:
  # AI provider configuration (loaded from environment)
  # Set via environment variables:
  # - GROQ_API_KEY, GROQ_MODEL for Groq (primary)
  # - GEMINI_API_KEY, GEMINI_MODEL for Gemini (fallback 1)
  # - OPENAI_API_KEY, OPENAI_MODEL for OpenAI (fallback 2)
  # Note: Zero model IDs are hardcoded; model IDs must be supplied via config/.env.
  
  # Provider priority / fallback chain
  enabled_providers:
    - groq
    - gemini
    - openai
